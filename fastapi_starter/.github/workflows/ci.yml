name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Same system packages as the Dockerfile, so the video/Hindi tests run for real
      # (they skip or go silent without them).
      - name: System packages (ffmpeg, espeak-ng, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core fonts-noto-core

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q -W ignore

      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
        run: |
          alembic upgrade head
          alembic check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency vulnerability scan (fails on any known CVE)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
